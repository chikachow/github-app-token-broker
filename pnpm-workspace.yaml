packages:
  - "packages/*"
  - "test/deployment/*"
  - "workers/*"

catalog:
  "@types/node": 24.19.2
  "fastify": 5.12.7
  "jose": 6.2.12
  "tsdown": 0.23.1
  "typescript": 7.0.2
  "zod": 4.6.7

allowBuilds:
  esbuild: false
  workerd: false

autoInstallPeers: false
strictPeerDependencies: false
engineStrict: true
minimumReleaseAge: 4320

# Explicit version selection and CI enforce the manifest pin; keep GitHub-compatible lockfiles.
pmOnFail: ignore
autoDedupe: true
lockfile:
  includeResolutionSettings: true
verifyDepsBeforeRun: error
strictDepBuilds: true
