packages:
  - "packages/*"
  - "test/deployment/*"
  - "workers/*"

autoInstallPeers: false
strictPeerDependencies: true
engineStrict: true
minimumReleaseAge: 4320
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

catalog:
  "@types/node": 24.13.4
  "fastify": 5.12.3
  "jose": 6.2.12
  "tsdown": 0.23.0
  "typescript": 7.0.2
  "zod": 4.5.4

allowBuilds:
  esbuild: false
  workerd: false
strictDepBuilds: true
