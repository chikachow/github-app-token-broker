packages:
  - "packages/*"
  - "test/deployment/*"
  - "workers/*"

catalog:
  "@types/node": 24.19.2
  "fastify": 5.12.8
  "jose": 6.2.15
  "tsdown": 0.23.4
  "typescript": 7.0.2
  "zod": 4.6.7

# Remove when an upgraded Miniflare resolves patched Undici (GHSA-xjj6-f33q-929c).
overrides:
  "miniflare@5.20261019.2-beta>undici": 7.30.1

allowBuilds:
  esbuild: false
  workerd: false

autoInstallPeers: false
strictPeerDependencies: false
engineStrict: true
minimumReleaseAge: 4320

# Explicit version selection and CI enforce the manifest pin; keep GitHub-compatible lockfiles.
pmOnFail: ignore
autoDedupe: true
catalogPrune: true
lockfile:
  includeResolutionSettings: true
verifyDepsBeforeRun: error
strictDepBuilds: true
