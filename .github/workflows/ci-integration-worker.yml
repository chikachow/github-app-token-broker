name: integration-worker

on:
  workflow_call:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: broker-integration-worker
      COMPOSE_FILE: test/integration/compose.yml
      COMPOSE_PROFILES: worker
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Build and start fixtures
        run: docker compose up --build --wait --wait-timeout 60 oidc github

      - name: Test the deployed Worker artifact
        run: |
          trap 'kill -KILL -- -"$test_pid" 2>/dev/null || true' EXIT
          trap 'exit 130' INT TERM
          setsid node --run test:integration &
          test_pid=$!
          wait "$test_pid"

      - name: Collect service failure logs
        if: ${{ failure() && steps.checkout.outcome == 'success' }}
        run: docker compose logs --no-color --tail 100 prepare oidc github worker

      - name: Remove containers, keys, network, and image
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 2
        run: docker compose down --volumes --remove-orphans --rmi all
