name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      coverage-artifact-id: ${{ steps.coverage-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate source, built artifacts, and production consumers
        run: node --run check

      - name: Enforce coverage thresholds against the same build
        run: pnpm run test:built --coverage

      - name: Reject dependency lockfile changes
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Preserve the coverage report
        id: coverage-artifact
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Report unavailable coverage artifact
        if: ${{ steps.coverage-artifact.outcome == 'failure' }}
        run: |
          echo "::warning::Coverage passed locally, but its report could not be uploaded."
          echo "Coverage passed locally, but its report could not be uploaded." >> "$GITHUB_STEP_SUMMARY"

  coverage-report:
    needs: source
    if: ${{ needs.source.outputs.coverage-artifact-id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          artifact-ids: ${{ needs.source.outputs.coverage-artifact-id }}
          path: coverage

      - name: Upload coverage to Codecov
        timeout-minutes: 2
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage/lcov.info
          flags: unittests
          use_oidc: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
          version: v11.3.1

      - name: Report coverage publication failure
        if: ${{ failure() }}
        timeout-minutes: 1
        run: |
          echo "::warning::Coverage publication failed; required validation results are unchanged."
          echo "Coverage publication failed; required validation results are unchanged." >> "$GITHUB_STEP_SUMMARY"

  integration-fastify:
    uses: ./.github/workflows/ci-integration-fastify.yml

  integration-worker:
    uses: ./.github/workflows/ci-integration-worker.yml

  ci:
    runs-on: ubuntu-latest
    needs:
      - source
      - integration-fastify
      - integration-worker
    if: ${{ always() }}
    steps:
      - name: Require all CI jobs to pass
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            exit 1
          fi

          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi

          if [[ "${{ contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            exit 1
          fi
