name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    uses: ./.github/workflows/ci-format.yml

  lint:
    uses: ./.github/workflows/ci-lint.yml

  env-types:
    uses: ./.github/workflows/ci-env-types.yml

  typecheck:
    uses: ./.github/workflows/ci-typecheck.yml

  knip:
    uses: ./.github/workflows/ci-knip.yml

  test:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-test.yml

  integration-fastify:
    uses: ./.github/workflows/ci-integration-fastify.yml

  integration-worker:
    uses: ./.github/workflows/ci-integration-worker.yml

  artifact-check:
    uses: ./.github/workflows/ci-artifact-check.yml

  node-deploy-check:
    uses: ./.github/workflows/ci-node-deploy-check.yml

  deploy-dry-run:
    uses: ./.github/workflows/ci-deploy-dry-run.yml

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs:
      - format
      - lint
      - env-types
      - typecheck
      - knip
      - test
      - integration-fastify
      - integration-worker
      - artifact-check
      - node-deploy-check
      - deploy-dry-run
    if: ${{ always() }}
    steps:
      - name: Require all CI jobs to pass
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            exit 1
          fi

          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi

          if [[ "${{ contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            exit 1
          fi
