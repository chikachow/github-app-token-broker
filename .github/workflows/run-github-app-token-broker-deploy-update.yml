name: run-github-app-token-broker-deploy-update

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  run:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: chikachow/cyspbot-app-token-action@bf8d299cd20f755c47feb733e3c0f56331a4b49e # v0.0.12
        id: cyspbot
        with:
          resource: https://api.github.com/repos/chikachow/github-app-token-broker-deploy
          scope: actions:write

      - run: gh workflow run update-github-app-token-broker.yml --repo chikachow/github-app-token-broker-deploy --ref main
        env:
          GH_TOKEN: ${{ steps.cyspbot.outputs.token }}
