version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Sydney
    commit-message:
      prefix: chore(github/workflows)
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Sydney
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The Cloudflare Worker test plugin currently supports Vitest 4 only.
      - dependency-name: vitest
        versions: [">=5.0.0 <6.0.0"]
      - dependency-name: "@vitest/coverage-istanbul"
        versions: [">=5.0.0 <6.0.0"]
    groups:
      cloudflare-workers-sdk:
        patterns:
          - "@cloudflare/vitest-plugin"
          - "@cloudflare/workers-types"
          - wrangler
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      oxc-tooling:
        patterns:
          - oxfmt
          - oxlint
          - oxlint-tsgolint
